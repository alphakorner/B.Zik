# B.Zik — web app (PWA) publiée sur GitHub Pages : https://alphakorner.github.io/B.Zik/
# Réglage unique : Settings > Pages > Source : GitHub Actions.
name: B.Zik Web

on:
  push:
    branches: [main]
    paths: ["web/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - name: Build du lecteur web B.Zik
        working-directory: web
        env:
          OPENTUNE_WEB_BASE: /B.Zik/player/
          # URL du Worker proxy (Settings > Secrets and variables > Actions > Variables > BZIK_PROXY)
          VITE_BZIK_PROXY: ${{ vars.BZIK_PROXY || 'https://bzik-appzikbj.strassweb67.workers.dev' }}
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @opentune/app build
          mkdir -p ../site/player
          cp -R app/dist/. ../site/player/
          cp app/dist/index.html ../site/player/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
